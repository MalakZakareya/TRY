[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-upload-starter"
version = "0.1.0"
description = "Starter Agentic AI project with a black and white upload interface."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34.0",
]

[tool.setuptools]
packages = [
    "api",
    "api.v1",
    "core",
    "core_agents",
    "models",
    "schemas",
    "services",
]

[tool.pyright]
typeCheckingMode = "strict"
